<!DOCTYPE html>
<html>
<head>
    <title>AI Agent Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .service-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .service-header { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #0056b3; }
        .status { font-weight: bold; }
        .online { color: green; }
        .offline { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Agent Web Dashboard</h1>
        <p style="text-align: center;">Unified launcher for OpenHands, Devika, and OpenClaw</p>
        
        {% for id, service in services.items() %}
        <div class="service-card">
            <div class="service-header">
                <h2>{{ service.name }}</h2>
                <span class="status offline">Status: Not Running</span>
            </div>
            <p>Runs on Port: {{ service.port }}</p>
            <div>
                <a href="/start/{{ id }}" class="btn">Start {{ service.name }}</a>
                <a href="http://{{ request.host.split(':')[0] }}:{{ service.port }}" target="_blank" class="btn" style="background: #28a745;">Open Web UI</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
