<!DOCTYPE html>
<html>
<head>
    <title>AI Agent Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .service-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        .service-header { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn:hover { background: #0056b3; }
        .status { font-weight: bold; }
        .online { color: green; }
        .offline { color: red; }
        .env-section { background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Agent Web Dashboard</h1>
        
        <div class="env-section">
            <h3>Configuration</h3>
            <p><strong>Google Account:</strong> {{ google_account }}</p>
            <p><strong>Gemini API Key:</strong> {% if gemini_key %}****{{ gemini_key[-4:] }}{% else %}Not Set{% endif %}</p>
        </div>

        {% for name, info in services.items() %}
        <div class="service-card">
            <div class="service-header">
                <h2>{{ name | title }}</h2>
                <span class="status {{ info.status }}">{{ info.status | upper }}</span>
            </div>
            <p>Port: {{ info.port }}</p>
            <div>
                <a href="http://152.70.119.22:{{ info.port }}" class="btn" target="_blank">Open UI</a>
            </div>
        </div>
        {% endfor %}
    </div>
</body>
</html>
